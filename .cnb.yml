main:
  push:
    - runner: { cpus: 2 }
      docker:
        image: golang:1.24
      stages:
        - name: build
          script: go build ./...
        - name: vet
          script: go vet ./...

$:
  vscode:
    - runner:
        cpus: 10
      docker:
        image: docker.cnb.cool/mint/default-dev-env
      services:
        - vscode
      stages:
        - name: ready
          script: echo "Cloud development environment is ready"
