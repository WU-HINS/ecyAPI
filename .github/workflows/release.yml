name: Release

# 手动触发：构建 linux/amd64 + linux/arm64 静态二进制，创建 GitHub Release，
# 并构建正式版多架构 Docker 镜像（版本号标签 + 可选 latest）。
# 日常 CI 只推 ci-* 标签，不会动 latest。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，必须形如 v1.2.3
        required: true
        type: string
      prerelease:
        description: 标记为预发布
        required: false
        default: false
        type: boolean
      push_latest:
        description: 同时把 Docker latest 指向本次版本
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: 校验版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          v="${{ inputs.version }}"
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "版本号不合法：$v（应形如 v1.2.3）"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  binaries:
    name: 二进制 ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 libwebp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebp-dev libsharpyuv-dev

      - name: 构建静态二进制
        run: |
          mkdir -p dist
          name="ecyapi-${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}"
          CGO_ENABLED=1 go build -tags "webp_system webp_sharpyuv" -trimpath \
            -ldflags="-s -w -extldflags '-static'" -o "dist/$name" ./cmd/server
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: 冒烟测试
        run: |
          bin="dist/ecyapi-${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}"
          file "$bin" | grep -q "statically linked"
          data="$(mktemp -d)"
          ECY_ADDR=127.0.0.1:18081 ECY_DATA_DIR="$data/categories" "$bin" &
          pid=$!
          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:18081/healthz | grep -q ok; then
              kill -TERM "$pid"
              wait "$pid" 2>/dev/null || true
              echo "冒烟通过：$bin"
              exit 0
            fi
            sleep 0.5
          done
          kill -TERM "$pid" 2>/dev/null || true
          exit 1

      - name: 计算校验和
        run: cd dist && sha256sum * > "SHA256SUMS-linux-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ecyapi-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: [validate, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # 只取二进制产物：docker/build-push-action 会在同一次运行里产生
          # *.dockerbuild 内部 artifact，无差别下载会失败。
          pattern: ecyapi-linux-*
          path: dist
          merge-multiple: true

      - name: 汇总校验和
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          NOTES="ecyAPI $V

          静态二进制：linux/amd64、linux/arm64（CGO + libwebp，无运行时依赖）
          Docker：ghcr.io/${{ github.repository }}:$V（多架构清单）

          校验：sha256sum -c SHA256SUMS.txt"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            gh release create "$V" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "$V" --notes "$NOTES" --prerelease
          else
            gh release create "$V" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "$V" --notes "$NOTES"
          fi

  docker:
    name: 正式版镜像 ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名（全小写）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 构建并推送 ${{ matrix.arch }} 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.validate.outputs.version }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

  docker-merge:
    name: 合并正式版多架构清单
    needs: [validate, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名（全小写）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 推送版本标签
        run: |
          V="${{ needs.validate.outputs.version }}"
          docker buildx imagetools create \
            -t "$IMAGE:$V" \
            "$IMAGE:$V-amd64" \
            "$IMAGE:$V-arm64"

      - name: 更新 latest
        if: ${{ inputs.push_latest }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            "$IMAGE:$V-amd64" \
            "$IMAGE:$V-arm64"
