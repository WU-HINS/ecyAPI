name: Docker CI

# 每次 push 到 main（或手动触发）构建 amd64 / arm64 镜像并推送 ci 标签。
# 本工作流永不推送 latest：latest 只由 Release 工作流在正式发版时更新。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 构建 ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 确认原生架构（不做 QEMU 模拟）
        run: echo "runner=${{ matrix.runner }} arch=$(uname -m)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名（全小写）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 构建并推送单架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          # CI 镜像不下载 50MB 素材，构建快；正式版镜像由 release.yml 带素材构建
          build-args: FETCH_ASSETS=0
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}

  merge:
    name: 合并多架构清单（ci 标签，不碰 latest）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名（全小写）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 防御性检查：CI 不得推送 latest
        run: |
          for tag in "ci-${GITHUB_SHA}" "ci-${GITHUB_SHA::7}" "ci"; do
            case "$tag" in
              *:latest) echo "CI 工作流不允许推送 latest"; exit 1 ;;
            esac
          done

      - name: 合并清单并推送 ci 标签
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:ci-${GITHUB_SHA}" \
            -t "$IMAGE:ci-${GITHUB_SHA::7}" \
            -t "$IMAGE:ci" \
            "$IMAGE:ci-${GITHUB_SHA}-amd64" \
            "$IMAGE:ci-${GITHUB_SHA}-arm64"

      - name: 冒烟测试（amd64 容器）
        run: |
          docker run -d --name ecy-smoke -p 18080:8080 "$IMAGE:ci-${GITHUB_SHA}"
          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q ok; then
              echo "健康检查通过"
              docker rm -f ecy-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs ecy-smoke || true
          docker rm -f ecy-smoke >/dev/null || true
          exit 1
