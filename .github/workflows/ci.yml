name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 libwebp（CGO 编码依赖）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebp-dev libsharpyuv-dev

      - name: 格式检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet -tags webp_system ./...

      - name: go test（含 race）
        run: CGO_ENABLED=1 go test -tags webp_system -race ./...

      - name: 静态编译冒烟（linux/amd64）
        run: |
          CGO_ENABLED=1 go build -tags webp_system -trimpath \
            -ldflags="-s -w -extldflags '-static'" -o /tmp/ecyapi ./cmd/server
          file /tmp/ecyapi | grep -q "statically linked"

      - name: CGO_ENABLED=0 可编译（预览降级为原图）
        run: CGO_ENABLED=0 go build -o /tmp/ecyapi-nocgo ./cmd/server
