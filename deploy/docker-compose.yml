# 单实例编排（推荐默认形态）：图片、绑定、设置、缩略图缓存全部落在 ./data。
# 用法：
#   cp .env.example .env && vi .env      # 至少改 ECY_ADMIN_PASSWORD
#   docker compose up -d
services:
  ecyapi:
    image: ghcr.io/wu-hins/ecyapi:latest
    container_name: ecyapi
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      # 后台密码：务必修改（默认 ecy-admin）
      ECY_ADMIN_PASSWORD: ${ECY_ADMIN_PASSWORD:?请在 .env 中设置 ECY_ADMIN_PASSWORD}
      # 对外域名：JSON/纯文本输出的链接用它拼接；留空按请求推断
      ECY_BASE_URL: ${ECY_BASE_URL:-}
      ECY_MAX_LINKS: ${ECY_MAX_LINKS:-50}
      ECY_MAX_UPLOAD_MB: ${ECY_MAX_UPLOAD_MB:-512}
      ECY_MAX_DEPTH: ${ECY_MAX_DEPTH:-3}
      ECY_GALLERY_MAX: ${ECY_GALLERY_MAX:-0}
      ECY_GALLERY_CONCURRENCY: ${ECY_GALLERY_CONCURRENCY:-2}
      ECY_GALLERY_WAIT: ${ECY_GALLERY_WAIT:-5}
      ECY_PREVIEW_MP: ${ECY_PREVIEW_MP:-16}
      ECY_SCAN_INTERVAL: ${ECY_SCAN_INTERVAL:-3}
      ECY_VERIFY_LINKS: ${ECY_VERIFY_LINKS:-}
      # Go 运行时软内存上限（字节），容器内存紧张时调小
      ECY_MEMORY_LIMIT: ${ECY_MEMORY_LIMIT:-}
      # 访问日志：设为 off 关闭（高 QPS 场景可省掉全部格式化开销）
      ECY_ACCESS_LOG: ${ECY_ACCESS_LOG:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 必须挂整个 /app/data：
      #   /app/data/categories      图片（分类即子目录，支持 a/b 多级）
      #   /app/data/endpoints.json  栏目绑定
      #   /app/data/settings.json   站点设置
      #   /app/data/logs.json       改动日志
      #   /app/data/gallery.json    图库隐藏分类
      #   /app/data/preview-cache   ?w= 缩略图缓存
      - ./data:/app/data
      # 看板娘素材在镜像的 /app/static（**不在 /app/data**，否则会被上面的卷遮住）。
      # 想自己改素材时再挂：./static:/app/static（注意：挂空目录同样会遮住镜像内素材）
      # - ./static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # 略大于 ECY_MEMORY_LIMIT，留出 CGO 编码与临时分配的余量
          memory: 768M
